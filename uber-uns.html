    </div><!-- .scroll-wrapper -->
    <script>

        // Scroll al top al cargar
        window.onbeforeunload = function () { window.scrollTo(0, 0); };
        window.onload = function () {
            const wrapper = document.querySelector('.scroll-wrapper');
            if (wrapper) wrapper.scrollTop = 0;
            window.scrollTo(0, 0);
        };
        if (history.scrollRestoration) history.scrollRestoration = 'manual';

        // Navegación
        document.querySelectorAll('.nav-links a').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                if (!href || !href.startsWith('#')) return;

                e.preventDefault();
                const targetId = href.substring(1);
                const targetSection = document.getElementById(targetId);
                const wrapper = document.querySelector('.scroll-wrapper');
                if (targetSection && wrapper) {
                    wrapper.scrollTo({ top: targetSection.offsetTop, behavior: 'smooth' });
                }
            });
        });


        window.addEventListener("load", function () {
            if (window.location.hash) {
              const target = document.querySelector(window.location.hash);
              if (target) {
                setTimeout(() => {
                  target.scrollIntoView({ behavior: "smooth" });
                }, 100);
              }
            }
          });

        // Flip-cards: toggle al hacer click o hover//

        const cards = document.querySelectorAll('.flip-card');

        function setCardState(card, isOpen) {
            card.classList.toggle('is-flipped', isOpen);
            const block = card.closest('.content-block-card');
            if (block) {
                block.classList.toggle('is-flipped', isOpen);
            }
        }

        function closeAllCards() {
            cards.forEach(c => setCardState(c, false));
        }

        cards.forEach(card => {
        
            // CLICK (móvil + también desktop si se hace click)
            card.addEventListener('click', function(e) {
                e.stopPropagation();
            
                const isAlreadyFlipped = this.classList.contains('is-flipped');
            
                // Cerrar todas
                closeAllCards();
            
                // Si no estaba abierta, abrirla
                if (!isAlreadyFlipped) {
                    setCardState(this, true);
                }
            });
          
            // HOVER solo para punteros con hover real (mouse/pen).
            card.parentElement.addEventListener('pointerenter', function(e) {
                if (e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
                closeAllCards();
                setCardState(card, true);
            });
          
            card.parentElement.addEventListener('pointerleave', function(e) {
                if (e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
                setCardState(card, false);
            });
          
        });

        // Click fuera → cerrar todas
        document.addEventListener('click', function() {
            closeAllCards();
        });

</script>


</body>
</html>
