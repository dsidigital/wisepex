</head>

    <div class="global-site-container">
        <div class="team-container-title">ÜBER UNS</div>
        <div class="content-block-uber-uns">
            
            <div class="team-container">
        
                <div class="content-block">
                  <div class="image-wrapper">
                    <div class="flip-card">
                      <div class="flip-front">
                        <img src="img/uber-uns1.avif" alt="Empleado 1">

                  <div class="content-text">

                    <div class="extra-text">
                      <p>Director de Operaciones.</p>
                      <p>Más de 10 años de experiencia.</p>

                  </div>
                </div>
            
                <div class="content-block">
                  <div class="image-wrapper">
                    <div class="flip-card">
                      <div class="flip-front">
                        <img src="img/uber-uns2.avif" alt="Empleado 2">

                    <strong>Anna Schmidt</strong>
                    <div class="extra-text">
                      <p>Marketing Manager.</p>
                      <p>Especialista en branding digital.</p>

                  </div>
                </div>
            
                <div class="content-block">
                  <div class="image-wrapper">
                    <div class="flip-card">
                      <div class="flip-front">

                </div>
              </div>
            </div>
        </div>
    </div>
    </div><!-- .scroll-wrapper -->
    <script>

        // Scroll al top al cargar
        window.onbeforeunload = function () { window.scrollTo(0, 0); };
        window.onload = function () {
            const wrapper = document.querySelector('.scroll-wrapper');
            if (wrapper) wrapper.scrollTop = 0;
            window.scrollTo(0, 0);
        };
        if (history.scrollRestoration) history.scrollRestoration = 'manual';

        // Navegación
        document.querySelectorAll('.nav-links a').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                if (!href || !href.startsWith('#')) return;

                e.preventDefault();
                const targetId = href.substring(1);
                const targetSection = document.getElementById(targetId);
                const wrapper = document.querySelector('.scroll-wrapper');
                if (targetSection && wrapper) {
                    wrapper.scrollTo({ top: targetSection.offsetTop, behavior: 'smooth' });
                }
            });
        });


        window.addEventListener("load", function () {
            if (window.location.hash) {
              const target = document.querySelector(window.location.hash);
              if (target) {
                setTimeout(() => {
                  target.scrollIntoView({ behavior: "smooth" });
                }, 100);
              }
            }
          });

        // Flip-cards: toggle al hacer click (para móviles/tablets)
        document.querySelectorAll('.flip-card').forEach(card => {
            card.addEventListener('click', function(e) {
                e.stopPropagation();
                this.classList.toggle('flipped');
            });
        });

    </script>
</body>
</html>
